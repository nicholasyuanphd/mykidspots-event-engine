# Wake County CivicPlus Towns
# Platform: civicplus (HTML list-view scraper)
# All are government sources (public domain descriptions)
# CID=0 = all calendar categories
# trust_level: "new" until category filtering is validated
#
# NOTE (2026-03-12): Only 3 of 7 originally listed towns are actually CivicPlus.
# Removed: Garner (CivicEngage + WAF), Knightdale (Drupal), Wake Forest (Drupal), Wendell (Revize).
# Those towns need platform-specific scrapers — deferred to a future phase.

sources:
  - id: "holly-springs-town-calendar"
    name: "Town of Holly Springs"
    platform: "civicplus"
    trust_level: "new"
    content_policy: "government"
    enabled: true
    timezone: "America/New_York"
    base_url: "https://www.hollyspringsnc.gov/calendar.aspx"
    location_id: "0"
    location:
      name: "Town of Holly Springs"
      address: "128 S Main St, Holly Springs, NC 27540"
      city: "Holly Springs"
      latitude: 35.6499
      longitude: -78.8336
    request_delay_ms: 1500
    default_cost_type: "free"
    ai_classification: "required"
    category_overrides:
