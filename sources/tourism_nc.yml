    timezone: "America/New_York"
    base_url: "https://www.wilmingtonandbeaches.com"
    location_id: ""
    location:
      name: "Wilmington"
      city: "Wilmington"
      latitude: 34.2257
      longitude: -77.9447
    request_delay_ms: 1500
    default_cost_type: "free"
    ai_classification: "required"
    selectors:
      rest_version: "v2"
    category_overrides:
      - "community"

  - id: "charlottesgotalot-events"
