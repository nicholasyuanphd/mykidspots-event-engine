    location_id: ""
    location:
      name: "Charlotte"
      city: "Charlotte"
      latitude: 35.2271
      longitude: -80.8431
    request_delay_ms: 1500
    default_cost_type: "free"
    ai_classification: "required"
    selectors:
      search_url: "https://search.charlottesgotalot.com"
      index: "cluster_events"
      api_key: "GKEuAXwR4*em@MJ7"
