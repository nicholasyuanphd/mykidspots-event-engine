# NC Tourism CVB Sources
# Platform: simpleview_rest (VisitRaleigh, Wilmington) | meilisearch (Charlotte)
# Content policy: commercial — descriptions always dropped (third-party copyright)
# AI classification: required — CVB events are mixed family/adult; classifier filters
# Trust level: new — events enter as pending for curator review until source is validated
# Asheville: DEFERRED — Cloudflare bot protection blocks all automated access

sources:
  - id: "visitraleigh-events"
    name: "Visit Raleigh Events"
    platform: "simpleview_rest"
    trust_level: "new"
    content_policy: "commercial"
    enabled: true
    timezone: "America/New_York"
    base_url: "https://www.visitraleigh.com"
    location_id: ""
    location:
      name: "Raleigh"
      city: "Raleigh"
      latitude: 35.7796
      longitude: -78.6382
    request_delay_ms: 1500
    default_cost_type: "free"
    ai_classification: "required"
    selectors:
      rest_version: "v1"
    category_overrides:
      - "community"

  - id: "wilmington-beaches-events"
    name: "Wilmington & Beaches Events"
    platform: "simpleview_rest"
    trust_level: "new"
    content_policy: "commercial"
