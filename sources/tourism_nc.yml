  - id: "outerbanks-events"
    name: "Outer Banks Events"
    platform: "simpleview_rest"
    trust_level: "new"
    content_policy: "commercial"
    enabled: false  # DISABLED: outerbanks.org is primarily a dining/tourism guide, not a family
    # activity calendar. Even with category exclusions, restaurant and bar listings dominate.
    # Re-enable only if a better kid-focused OBX source is found (e.g. Dare County parks/library).
    timezone: "America/New_York"
    base_url: "https://www.outerbanks.org"
    location_id: ""
    location:
      name: "Outer Banks"
      city: "Nags Head"
      latitude: 35.9382
      longitude: -75.6249
    request_delay_ms: 1500
    default_cost_type: "free"
    ai_classification: "required"
    selectors:
      rest_version: "v1"
      # Outer Banks CVB mixes restaurant promos and nightlife into the event calendar.
      # These categories are clearly adult-only and should be excluded before AI filtering.
      excluded_categories: "nightlife,bars + breweries,bars & breweries,restaurants,food & drink,dining"
    category_overrides:
      - "community"

