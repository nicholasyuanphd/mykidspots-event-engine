name: Validate Contracts

on:
  pull_request:
    paths:
      - "contracts/**"
      - "sources/**"
      - "src/event_engine/normalize/pipeline.py"
      - "src/event_engine/normalize/category_mapper.py"
      - "scripts/validate_contracts.py"
  push:
    branches:
      - main
      - staging
    paths:
      - "contracts/**"
      - "sources/**"
      - "src/event_engine/normalize/pipeline.py"
      - "src/event_engine/normalize/category_mapper.py"

jobs:
  validate-contracts:
    name: Validate cross-repo contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Run contract validator
        run: uv run python scripts/validate_contracts.py
