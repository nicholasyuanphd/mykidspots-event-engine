name: Audit Source

on:
  workflow_dispatch:
    inputs:
      source_id:
        description: "Source ID to audit (e.g. visitraleigh-events)"
        required: true
        type: string

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Run graduation audit
        env:
          SOURCE_ID: ${{ inputs.source_id }}
        run: uv run python -m event_engine audit-source "$SOURCE_ID" --verbose
