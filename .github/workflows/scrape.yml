name: Scrape Events

on:
  schedule:
    - cron: "0 6 * * *"   # 1 AM ET (EST)
    - cron: "0 18 * * *"  # 1 PM ET (EST)
  workflow_dispatch:
    inputs:
      source_filter:
        description: "Glob pattern to filter source IDs (e.g., 'wake_*')"
        required: false
        type: string
      dry_run:
        description: "Dry run (scrape + normalize, skip DB writes)"
        required: false
        type: boolean
        default: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Run Event Engine
        env:
          SOURCE_FILTER: ${{ inputs.source_filter }}
          DRY_RUN_FLAG: ${{ inputs.dry_run == true && '--dry-run' || '' }}
        run: |
          ARGS=""
          if [ -n "$SOURCE_FILTER" ]; then
            ARGS="$ARGS --source-filter $SOURCE_FILTER"
          fi
          if [ -n "$DRY_RUN_FLAG" ]; then
            ARGS="$ARGS --dry-run"
          fi
          uv run python -m event_engine $ARGS
