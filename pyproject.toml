[project]
name = "mykidspots-event-engine"
version = "0.1.0"
description = "Automated event scraping engine for MyKidSpots"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "asyncpg>=0.30",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "pyyaml>=6.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "python-dateutil>=2.9",
    "icalendar>=6.0",
    "tenacity>=9.0",
    "structlog>=24.4",
    "sentry-sdk>=2.0",
]

[project.optional-dependencies]
playwright = ["playwright>=1.49"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "respx>=0.22",
]

[project.scripts]
event-engine = "event_engine.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/event_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TCH"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["asyncpg.*", "bs4.*", "lxml.*", "icalendar.*"]
ignore_missing_imports = true
